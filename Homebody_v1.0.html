<title>Homebody</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one framed 3D stage. Screens (menu, character creator) and glass HUD sit on top of it. */
:root {
  color-scheme: dark;
  --bg: #0c1020; --panel: rgba(16, 21, 40, .86); --line: rgba(160, 180, 255, .2);
  --ink: #eef1ff; --muted: #9aa4c7; --accent: #7cc4ff; --good: #6ee7a8; --bad: #ff6b6b;
  --hunger: #ff9f5a; --energy: #a78bfa; --fun: #ff7eb6; --clean: #5ad1e6; --bladder: #f2d15c; --social: #7bd88f;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-weight: 600;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
input { -webkit-user-select: text; user-select: text; }
.stage { position: relative; width: 100%; max-width: 960px; height: 100%; border-radius: 14px; overflow: hidden; background: #0a0f22; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.lbl { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.small { font-size: 13px; color: var(--muted); }
.btn { font: 800 14px var(--font-body); background: rgba(124, 196, 255, .14); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; cursor: pointer; }
.btn:hover { background: rgba(124, 196, 255, .26); }
.btn.go { background: var(--accent); color: #07101f; border-color: transparent; }
.btn.big { width: 100%; padding: 13px; font-size: 16px; margin-top: 10px; }
.btn.warn { background: rgba(255, 107, 107, .2); }
.btn.danger { background: #d62f2f; color: #fff; border-color: transparent; }   /* Delete a save: red for emphasis */
.btn.danger.warn { background: #d62f2f; color: #fff; }   /* confirm state: same red */
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:focus-visible, .speed button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#game { position: absolute; inset: 0; pointer-events: none; }
.top { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; justify-content: space-between; gap: 8px; }
.clock { display: flex; gap: 12px; align-items: baseline; padding: 8px 12px; white-space: nowrap; min-width: 0; }
.clock b { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
#money { color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }
.speed { display: flex; gap: 4px; padding: 4px; pointer-events: auto; }
.speed button { min-width: 38px; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font: 800 13px var(--font-body); cursor: pointer; }
.speed button.on { background: var(--accent); color: #07101f; }
.needs { position: absolute; left: 10px; right: 10px; top: 62px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.need { padding: 7px 8px 9px; min-width: 0; }
.need .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.need .nrow { display: flex; align-items: center; gap: 5px; }
.need .nrow .bar { flex: 1; min-width: 0; }
.need .nico { font-size: 13px; line-height: 1; flex: none; }
.need.low { border-color: var(--bad); }
.bar { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .25s; background: var(--accent); }
.relm { flex-basis: 100%; margin: 0 0 4px; }
.relh { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.relbar { position: relative; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.relbar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, .35); }
.relbar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.viewbtn { position: absolute; right: 10px; top: 116px; pointer-events: auto; background: var(--panel); }
.buffs { position: absolute; left: 10px; top: 116px; display: flex; gap: 6px; }
.buff { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; pointer-events: auto; cursor: default; touch-action: none; -webkit-touch-callout: none; border-color: var(--good); }
.buff .bico { font-size: 19px; line-height: 1; }
.buff .bbadge { position: absolute; right: -4px; bottom: -5px; font: 800 9px var(--font-body); background: var(--good); color: #07101f; border-radius: 6px; padding: 1px 3px; }
.buff .btip { position: absolute; left: 0; top: calc(100% + 8px); width: max-content; max-width: 220px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; z-index: 9; text-align: left; background: #111a33; }
.buff .btip[hidden] { display: none; }
.bubble { position: absolute; left: 0; top: 0; padding: 4px 10px; border-radius: 10px; background: rgba(255, 255, 255, .94); color: #18203a; font: 800 13px var(--font-body); white-space: nowrap; will-change: transform; }
.bottom { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.bottom .panel, .tools button { pointer-events: auto; }
.toast { align-self: center; white-space: pre-line; padding: 7px 14px; border-radius: 10px; background: var(--accent); color: #07101f; font-weight: 800; font-size: 14px; text-align: center; }
.menu { padding: 10px 12px 12px; }
.menuhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.menuhead b, h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.tools { display: flex; gap: 8px; }
.tools .btn { flex: 1; min-width: 0; padding: 9px 4px; }   /* five buttons share the width on a phone */
.tools button { flex: 1; background: var(--panel); }
.status { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; }
.who { display: flex; gap: 8px; align-items: center; min-width: 0; }
.who b { font-family: var(--font-display); font-weight: 600; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 99px; color: #07101f; background: var(--good); }
#doing { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status .btn { grid-column: 2; grid-row: 1 / span 2; }
.prog { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }
.screen { position: absolute; inset: 0; display: flex; padding: 14px; pointer-events: none; }
.screen > * { pointer-events: auto; }
.screen.center { align-items: center; justify-content: center; }
.screen.bottom2 { align-items: flex-end; justify-content: center; }
.patchbtn { width: 100%; margin-top: 12px; }
.patchday { margin-top: 14px; }
.patchday h3 { font: 900 13px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
.patchday ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.4; }
.patchday li { margin: 4px 0; }
.patchday li b { color: #fff; }
.card { width: 100%; max-width: 430px; padding: 18px; max-height: 100%; overflow-y: auto; touch-action: pan-y; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 40px; line-height: 1.05; margin: 0 0 4px; }
h1 span { color: var(--accent); }
.slot { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
.slot .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.slot .meta b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field { margin-top: 12px; }
.field input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255, 255, 255, .08); color: var(--ink); font: 700 16px var(--font-body); }
.seg { display: flex; gap: 8px; }
.seg .btn { flex: 1; }
.seg .btn.on { background: var(--accent); color: #07101f; }
.sw { display: flex; gap: 8px; flex-wrap: wrap; }
.sw button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
.sw button.on { border-color: #fff; }
.sheet { position: absolute; left: 10px; right: 10px; bottom: 10px; height: min(62%, 480px); display: flex; flex-direction: column; overflow: hidden; z-index: 5; }
.tabs { display: flex; gap: 5px; padding: 8px; border-bottom: 1px solid var(--line); flex: none; }
.tabs .btn { flex: 1; min-width: 0; padding: 8px 2px; font-size: 13px; }
.tabs .btn.on { background: var(--accent); color: #07101f; }
.sbody { flex: 1; min-height: 0; overflow-y: scroll; padding: 4px 10px 14px 12px; touch-action: pan-y; scrollbar-width: thin; scrollbar-color: var(--accent) rgba(255, 255, 255, .08); }
.sbody::-webkit-scrollbar { width: 8px; }
.sbody::-webkit-scrollbar-track { background: rgba(255, 255, 255, .08); border-radius: 4px; }
.sbody::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
.subtabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; position: sticky; top: 0; background: #151a2e; z-index: 1; }
.subtabs .btn { padding: 7px 11px; font-size: 13px; flex: none; white-space: nowrap; }
.subtabs .btn.on { background: var(--accent); color: #07101f; }
.row2 { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row2 .grow { flex: 1; min-width: 0; }
.row2 b { display: block; }
.row2 .ico { font-size: 26px; line-height: 1; width: 34px; text-align: center; flex: none; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
.sk { padding: 10px 0; border-bottom: 1px solid var(--line); }
.sk .head { display: flex; justify-content: space-between; }
.sk .skrow { display: flex; align-items: center; gap: 10px; }
.sk .skrow .grow { flex: 1; min-width: 0; }
.sk .skico { font-size: 26px; line-height: 1; width: 34px; text-align: center; flex: none; }
.unl { font-size: 13px; color: var(--muted); margin-top: 4px; }
.unl.on { color: var(--good); }
/* popups: save confirmation, level up; skill meter inside the head bubble */
.pop { position: absolute; left: 50%; z-index: 8; pointer-events: auto; text-align: center; transform: translateX(-50%); }
.pop.show { animation: popIn .32s cubic-bezier(.2, 1.5, .4, 1) both; }
.pop.hide { animation: popOut .25s ease-in both; }
@keyframes popIn { from { opacity: 0; transform: translateX(-50%) scale(.6); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
@keyframes popOut { from { opacity: 1; transform: translateX(-50%) scale(1); } to { opacity: 0; transform: translateX(-50%) scale(.85); } }
#decorPop { bottom: 150px; width: min(320px, 88%); padding: 14px 14px 12px; border: 2px solid var(--accent); box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
#decorPop .tag { color: var(--accent); font: 900 12px var(--font-body); letter-spacing: .16em; text-transform: uppercase; }
#decorPop h2 { font-size: 20px; margin: 4px 0 2px; }
#decorPop p { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
#decorPop .acts { display: flex; gap: 8px; }
#decorPop .acts .btn { flex: 1; }
#savePop { top: 64px; display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; text-align: left; border-color: var(--good); }
#savePop .ok { width: 30px; height: 30px; border-radius: 50%; background: var(--good); color: #07101f; display: grid; place-items: center; font: 900 18px var(--font-body); flex: none; }
#savePop.fail { border-color: var(--bad); }
#savePop.fail .ok { background: var(--bad); }
#savePop b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
#lvlPop { top: 18%; width: min(300px, 82%); padding: 18px 16px 14px; border: 2px solid #ffd166; box-shadow: 0 0 0 4px rgba(255, 209, 102, .18), 0 10px 40px rgba(0, 0, 0, .5); }
#lvlPop .ico { font-size: 44px; line-height: 1; animation: lvlBounce 1.1s ease-in-out infinite; }
#lvlPop .tag { color: #ffd166; font: 900 12px var(--font-body); letter-spacing: .2em; text-transform: uppercase; margin-top: 8px; }
#lvlPop h2 { font-size: 24px; margin: 2px 0 6px; }
#lvlPop .stars { color: #ffd166; font-size: 18px; letter-spacing: 3px; }
#lvlPop .stars span { color: rgba(255, 255, 255, .18); }
#lvlPop p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
#lvlPop p.unl2 { color: var(--good); }
#lvlPop .btn { margin-top: 12px; width: 100%; }
#lvlPop .row { display: flex; justify-content: space-between; gap: 12px; margin: 6px 0 0; font-size: 14px; }
#lvlPop .row b { color: #fff; }
#lvlPop .row.tot { border-top: 1px solid rgba(255, 255, 255, .15); padding-top: 6px; font-weight: 800; color: var(--good); }
#lvlPop .row.tot b { color: var(--good); }
@keyframes lvlBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.08); } }
.bubble.skill { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 10px 6px; }
.bubble.skill .bt { display: flex; align-items: center; gap: 6px; }
.bubble.skill .bi { font-size: 16px; line-height: 1; display: inline-block; animation: lvlBounce .9s ease-in-out infinite; }
.bubble.skill .sxp { display: flex; align-items: center; gap: 6px; font: 900 10px var(--font-body); color: #45507a; }
.bubble.skill .sbar { width: 64px; height: 6px; border-radius: 3px; background: rgba(24, 32, 58, .15); overflow: hidden; }
.bubble.skill .sbar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb703, #ffd166); border-radius: 3px; }
.h3 { font-family: var(--font-display); font-size: 15px; margin: 12px 0 0; color: var(--accent); }
@media (max-width: 460px) { .need .lbl { font-size: 7.5px; letter-spacing: 0; } .need { padding: 7px 4px 9px; } .need .nrow { gap: 3px; } .need .nico { font-size: 10px; } .needs { gap: 4px; } .clock b { font-size: 14px; } .clock { flex-direction: column; align-items: flex-start; gap: 1px; padding: 6px 10px; font-size: 13px; line-height: 1.2; } .speed { align-self: flex-start; } .speed button { min-width: 32px; padding: 6px 6px; } h1 { font-size: 34px; } }
@media (max-width: 350px) { .clock b { font-size: 12.5px; } .clock { padding: 6px 8px; } .speed { gap: 2px; } .speed button { min-width: 28px; padding: 6px 4px; } .top { gap: 6px; } }
</style>

<main class="stage" id="stage">
  <canvas id="c"></canvas>

  <div id="game" hidden>
    <div class="top">
      <div class="panel clock"><b id="clock">Day 1 · 8:00 AM</b><span id="money">$100</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var stage = document.getElementById("stage");
  var canvas = document.getElementById("c");
  if (!window.THREE) { stage.innerHTML = '<p style="padding:24px">The 3D engine did not load. Reload the page to try again.</p>'; return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
  catch (err) { stage.innerHTML = '<p style="padding:24px">This browser cannot draw 3D graphics here.</p>'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  /* Color pipeline: lighting runs in linear space, output is sRGB with ACES tone mapping.
     Every hex color in this file is an sRGB value, so setHex converts it to linear on the way in. */
